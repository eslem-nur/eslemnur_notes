<body>

    <header>
        <div class="container">
            <nav>

        </div>

    <div class="container">
        <h1>🌸 Nur Koran 🌸</h1>
        <p class="header-sub">رَبِّ زِدْنَا عِلْمًا | Oh Allah, mehre unser Wissen.</p>

        <div class="controls">
            <select id="translationSelect">
                <option value="de.bubenheim">Frank Bubenheim & Nadeem Elyas</option>
                <option value="de.khoury">Adel Theodor Khoury</option>
                <option value="de.zaidan">Hamza Wolfgang Zaidan</option>
            </select>
            <select id="surahSelect">
                <option value="" disabled selected>Wählen Sie eine Sure...</option>
            </select>
            <button onclick="displaySurah()">Lesen</button>
        </div>

        <div id="content" class="quran-display">
            <p class="loading">Bitte wählen Sie eine Übersetzung und Sure zum Starten...</p>
        </div>
        
        
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }

        const menuLinks = document.querySelectorAll('.nav-links a');
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                const navLinks = document.querySelector('.nav-links');
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                }
            });
        });

        
        // DEUTSCHE SURENNAMEN KARTIERUNGSTABELLE
        const deSurahNames = {
            1: "Al-Fatihah", 2: "Al-Baqarah", 3: "Ali 'Imran", 4: "An-Nisa'", 5: "Al-Ma'idah", 6: "Al-An'am", 7: "Al-A'raf", 8: "Al-Anfal", 9: "At-Tawbah", 10: "Yunus",
            11: "Hud", 12: "Yusuf", 13: "Ar-Ra'd", 14: "Ibrahim", 15: "Al-Hidschr", 16: "An-Nahl", 17: "Al-Isra'", 18: "Al-Kahf", 19: "Maryam", 20: "Taha",
            21: "Al-Anbiya", 22: "Al-Hadsch", 23: "Al-Mu'minun", 24: "An-Nur", 25: "Al-Furqan", 26: "Ash-Shu'ara'", 27: "An-Naml", 28: "Al-Qasas", 29: "Al-'Ankabut", 30: "Ar-Rum",
            31: "Luqman", 32: "As-Sadschda", 33: "Al-Ahzab", 34: "Saba'", 35: "Fatir", 36: "Ya Sin", 37: "As-Saffat", 38: "Sad", 39: "Az-Zumar", 40: "Ghafir",
            41: "Fussilat", 42: "Ash-Schura", 43: "Az-Zuchruf", 44: "Ad-Dukhan", 45: "Al-Dschathiyah", 46: "Al-Ahqaf", 47: "Muhammad", 48: "Al-Fath", 49: "Al-Hidschurat", 50: "Qaf",
            51: "Adh-Dhariyat", 52: "At-Tur", 53: "An-Nadschm", 54: "Al-Qamar", 55: "Ar-Rahman", 56: "Al-Waqi'ah", 57: "Al-Hadid", 58: "Al-Mudschatila", 59: "Al-Haschr", 60: "Al-Mumtahana",
            61: "As-Saff", 62: "Al-Dschumu'a", 63: "Al-Munafiqun", 64: "At-Taghabun", 65: "At-Talaq", 66: "At-Tahrim", 67: "Al-Mulk", 68: "Al-Qalam", 69: "Al-Haqqah", 70: "Al-Ma'aridsch",
            71: "Nuh", 72: "Al-Dschinn", 73: "Al-Muzzammil", 74: "Al-Muddattsir", 75: "Al-Qijamah", 76: "Al-Insan", 77: "Al-Mursalat", 78: "An-Naba'", 79: "An-Nazi'at", 80: "'Abasa",
            81: "At-Takwir", 82: "Al-Infitar", 83: "Al-Mutaffifin", 84: "Al-Inshiqaq", 85: "Al-Burudsche", 86: "At-Tariq", 87: "Al-A'la", 88: "Al-Ghaschiyah", 89: "Al-Fadschr", 90: "Al-Balad",
            91: "Ash-Shams", 92: "Al-Lail", 93: "Ad-Duha", 94: "Asch-Scharh", 95: "At-Tin", 96: "Al-Alaq", 97: "Al-Qadr", 98: "Al-Baijinah", 99: "Az-Zalzalah", 100: "Al-'Adijat",
            101: "Al-Qari'a", 102: "At-Takathur", 103: "Al-Asr", 104: "Al-Humazah", 105: "Al-Fil", 106: "Quraisch", 107: "Al-Ma'un", 108: "Al-Kausar", 109: "Al-Kafirun", 110: "An-Nasr",
            111: "Al-Masd", 112: "Al-Ihlas", 113: "Al-Falaq", 114: "An-Nas"
        };

        // Übersetzungs-Namen zur Anzeige
        const translationNames = {
            'de.bubenheim': 'Frank Bubenheim & Dr. Nadeem Elyas (2000)',
            'de.khoury': 'Adel Theodor Khoury (1987)',
            'de.zaidan': 'Hamza Wolfgang Zaidan (2000)'
        };

        const translationSelect = document.getElementById('translationSelect');
        const surahSelect = document.getElementById('surahSelect');
        const contentDiv = document.getElementById('content');
        let surahData = [];

        // Sure-Liste laden
        async function loadSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahData = data.data;
                
                surahSelect.innerHTML = '<option value="" disabled selected>Wählen Sie eine Sure...</option>';
                
                surahData.forEach(surah => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    const deName = deSurahNames[surah.number] || surah.name;
                    option.text = `${surah.number}. ${deName}`;
                    surahSelect.appendChild(option);
                });
            } catch (error) {
                contentDiv.innerHTML = "<p>Fehler beim Laden der Sure-Liste. Bitte aktualisieren Sie die Seite.</p>";
                console.error('Fehler beim Laden der Sure-Liste:', error);
            }
        }

        // Sure abrufen und anzeigen
        async function displaySurah() {
            const surahNumber = surahSelect.value;
            const translationId = translationSelect.value;
            
            if(!surahNumber) {
                contentDiv.innerHTML = "<p>Bitte wählen Sie eine Sure aus.</p>";
                return;
            }

            if(!translationId) {
                contentDiv.innerHTML = "<p>Bitte wählen Sie eine Übersetzung aus.</p>";
                return;
            }

            contentDiv.innerHTML = '<p class="loading">Wird geladen...</p>';

            try {
                // Arabischen Text abrufen
                const resAr = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.alafasy`);
                // Gewählte Übersetzung abrufen
                const resTrans = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${translationId}`);
                
                const dataAr = await resAr.json();
                const dataTrans = await resTrans.json();

                const ayahsAr = dataAr.data.ayahs;
                const ayahsTrans = dataTrans.data.ayahs;
                
                const name = deSurahNames[surahNumber] || dataAr.data.name;

                let html = `<h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color);">${name}</h2>`;
                html += `<p class="translation-info">${translationNames[translationId]}</p>`;
                
                // Basmala (Außer Fatihah und Tawbah)
                if(surahNumber != 1 && surahNumber != 9) {
                    html += `<span class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>`;
                }

                ayahsAr.forEach((ayah, index) => {
                    const textAr = ayah.text.replace(/[\u0660-\u0669]/g, ''); 
                    const textTrans = ayahsTrans[index].text;
                    
                    html += `
                        <div class="arabic">${textAr} <span style="color:var(--primary-color); font-size:1.2rem; font-family:'Lato'">(${index + 1})</span></div>
                        <div class="translation">${textTrans}</div>
                        <hr style="border:0; border-top:1px dashed var(--border-color); margin: 25px 0;">
                    `;
                });

                contentDiv.innerHTML = html;

            } catch (error) {
                contentDiv.innerHTML = "<p>Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.</p>";
                console.error('Fehler beim Laden der Sure:', error);
            }
        }

        // Bei Seitenladen initialisieren
        window.addEventListener('DOMContentLoaded', () => {
            initTheme(); // Thema initialisieren
            loadSurahList(); // Sure-Liste abrufen
        });
    </script>
</body>
