<!DOCTYPE html>
<html lang="en" data-color="black" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKuran | Eslem Nur Çetin</title>
    <meta name="description" content="Eslem Nur Çetin - Theology student and web developer's iKuran application. Listen to Quran on digital iPod.">
    <meta name="keywords" content="Islamic Studies, Web Development, Tafsir, Arabic, Quran, Proton, Eslem Nur Çetin, Imam Hatip, Digital Notes, iKuran, iPod, pink">
    <meta name="author" content="Eslem Nur Çetin">
    <meta name="robots" content="index, follow">

    
    <!-- Open Graph (For Social Media Sharing) -->
    <meta property="og:title" content="Eslem Nur Çetin | iKuran Black">
    <meta property="og:description" content="Student of Islamic knowledge and developer portfolio. Free scholarly notes and digital applications.">
    <meta property="og:image" content="https://i.pinimg.com/736x/dc/e8/56/dce8561ec0b4854921dbcc65be75d1dd.jpg">
    <meta property="og:url" content="https://eslem-nur.github.io/official/en/">
    <meta property="og:type" content="Web App">
    <meta property="og:locale" content="en_US">

    <!-- PWA Manifest  -->
    <link rel="apple-touch-icon" sizes="180x180" href="/official/PWA/png/apple-touch-icon2.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/official/PWA/png/favicon2-96x96.png" />
    <link rel="manifest" href="/official/PWA/manifest/site2.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/official/PWA/svg/favicon2.svg" />
    <link rel="shortcut icon" href="/official/PWA/icon/favicon2.ico" />

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          
          navigator.serviceWorker.register('/official/PWA/js-files/sw2.js', { scope: '/official/' })
            .then(reg => console.log('Service Worker registered successfully!', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
    
  <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <!-- iKuran CSS -->
    <link rel="stylesheet" href="/official/style-sheets/ikuran-styles-black.css">

   
</head>
<body>

<div class="ipod-container">
    
    <!-- Screen -->
    <div class="screen">
        <div class="screen-header">
          <div class="battery-status-container">
            <span class="rotated-battery">🔋</span>
            <span class="battery-text">100%</span>
        </div>
            <span>iKuran</span>
       </div>
        
        <!-- 1. List View -->
        <ul class="surah-list" id="surah-list">
            <li style="padding: 10px; text-align: center;">Loading...</li>
        </ul>

        <!-- 2. Player View -->
        <div class="player-view" id="player-view">
            <div class="now-playing-title" id="np-title">Surah Name</div>
            <div class="now-playing-reciter">Mishary Alafasy</div>
            <div style="font-size: 40px; "><i class='fa-solid fa-music' style='color: #000'></i></div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div style="font-size:10px; color: #888;">
                <span id="curr-time">0:00</span> / <span id="dur-time">0:00</span>
            </div>
            
            <!-- Control buttons inside player -->
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <button class="settings-btn" id="btn-prev-track"><i class='fa fa-fast-backward'></i> Previous</button>
                <button class="settings-btn" id="btn-next-track">Next <i class='fa fa-fast-forward'></i></button>
            </div>
        </div>

                <!-- 3. SETTINGS VIEW -->
        <div class="player-view" id="settings-view" style="display: none;">
    <div class="now-playing-title">Settings</div>
    
    <!-- Scrollable content -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; margin-bottom: 20px; width: 80%;">
        <!-- Buttons -->
        <button id="btn-theme" class="settings-btn">
                    <i class='fas fa-moon' id="theme-icon"></i> 
                    <span id="theme-text">Dark Mode</span>
                </button>
                
                <button id="btn-repeat" class="settings-btn" style="color: #FFF9F9;">
                    Repeat Mode <i class='fas fa-sync-alt' style='color: white'></i>
                </button>
                <button id="btn-shuffle" class="settings-btn" style="color: #FFF9F9;">
                    Shuffle <i class='fas fa-random' style='color: white'></i>
                </button>
            </div>

    
    <!-- Speed control -->
    <div style="font-size: 12px; color: #888; margin-bottom: 6px;">Speed: <span id="speed-display">1.0x</span></div>
            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: center;">
                <button class="settings-btn" id="btn-speed-down" style="font-size: 10px; margin-bottom: 70px;"><i class='fas fa-minus'></i></button>
                <button class="settings-btn" id="btn-speed-up" style="font-size: 10px; margin-bottom: 70px; "><i class='fas fa-plus'></i></button>
            </div>
        </div>
        
        <!-- Status Messages -->
        <div id="msg-loading" class="status-msg msg-loading">Loading...</div>
        <div id="msg-player" class="status-msg msg-player">Playing</div>
        <div id="msg-skip" class="status-msg msg-skip">+5s</div>
        <div id="msg-volume" class="status-msg msg-volume">Volume</div>
        <div id="msg-repeat" class="status-msg msg-repeat">Repeat</div>
        <div id="msg-shuffle" class="status-msg msg-shuffle">Shuffle</div>
        <div id="msg-speed" class="status-msg msg-speed">1.0x Speed</div>
    </div>
    <!-- Click Wheel -->
    <div class="click-wheel" id="wheel">
        <div class="wheel-label lbl-menu">Menu</div>
        <div class="wheel-label lbl-prev"><i class='fa fa-fast-backward'></i></div>
        <div class="wheel-label lbl-next"><i class='fa fa-fast-forward'></i></div>
        <div class="wheel-label lbl-play"><i class='fa fa-play'></i> <i class='fa fa-pause'></i></div>
        <div class="wheel-center" id="center-btn"></div>
    </div>
</div>

<!-- Hidden Audio Element -->
<audio id="audio-player"></audio>

    <!-- iKuran JavaScript -->
    <script src="../ikuran-scripts.js"></script>

</body>
</html>
