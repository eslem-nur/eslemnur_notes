    <style>
      :root {--bg-color: #FFF9F9;
             --container-prim: #dd8399;
             --container-sec: #FFebf0;
             --bg-screen: #fff;
             --box-shadow: 0 20px 40px rgba(160, 100, 120, 0.2);

             --shadow-dark: rgba(180, 100, 120, 0.25);   
             --shadow-deep: rgba(140, 60, 80, 0.35); 
             --border: #999;
      }
      
      [data-theme="dark"] {--bg-color: #1e1e1e;
             --container-prim: #dd8399;
             --container-sec: #FFebf0;
             --bg-screen: #fff;
             --shadow-light: rgba(255, 255, 255, 0.5);

             --shadow-deep: rgba(80, 20, 40, 0.5);

             --border: #555;}
      
      [data-theme="dark"] body {
      background-image: none;

        /* --- GENERAL SETTINGS --- */
      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at 30% 30%, var(--bg-color) 0%, #FFebf0 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        user-select: none;
      }
      


      /* --- MOBILE DEFAULT (300x500) --- */
      .ipod-container {
        width: 300px;
        height: 500px;
        background: linear-gradient(135deg, var(--container-sec) 0%, var(--container-prim) 100%);
        border-radius: 45px;
        border: none;
        
        box-shadow: 
        15px 15px 40px var(--shadow-dark),      
        -5px -5px 20px var(--shadow-light),     
        inset 2px 2px 8px var(--shadow-light),  
        inset -2px -2px 8px var(--shadow-deep), 
        inset 0 0 20px rgba(0, 0, 0, 0.1);  
        
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px;
        position: relative;
        transition: all 0.3s ease;
      }

      .ipod-container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 45px;
        box-shadow: 
        15px 15px 40px var(--shadow-dark),      
        -5px -5px 20px var(--shadow-light),     
        inset 2px 2px 8px var(--shadow-light),  
        inset -2px -2px 8px var(--shadow-deep), 
        inset 0 0 20px rgba(0, 0, 0, 0.1);  

        pointer-events: none;
        z-index: 1;
      }
      .screen {
        width: 240px;
        height: 200px;
        background-color: var(--bg-screen);
        border: 1px solid #b1b1b1;
        border-radius: 12px;
        margin-bottom: 35px;
        overflow: hidden;
        position: relative;
        z-index: 2;
        box-shadow: 
          inset 3px 3px 8px rgba(0,0,0,0.3), 
          0 2px 5px rgba(0,0,0,0.1); 
      }


      .click-wheel {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: linear-gradient(145deg, #f0f0f0, #e6e6e6);
        border: 1px solid #d1d1d1;
        position: relative;
        z-index: 2;
        box-shadow: 
        8px 8px 20px var(--shadow-dark),
        -4px -4px 10px var(--shadow-light),
        inset 2px 2px 5px var(--shadow-light),
        inset -2px -2px 5px var(--shadow-deep),
        inset 0 0 10px rgba(0, 0, 0, 0.1);
        touch-action: none;
      }
        

      .wheel-center {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, var(--container-sec) 0%, var(--container-prim) 100%);
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid #ccc;
        box-shadow: 
        3px 3px 8px var(--shadow-dark),
        -2px -2px 5px var(--shadow-light),
        inset 1px 1px 2px var(--shadow-light);
        cursor: pointer;
        z-index: 3;
      }

      
      .wheel-center:active {
        transform: translate(-50%, -50%) scale(0.98);
        box-shadow: 
        inset 3px 3px 8px var(--shadow-deep),
        inset -2px -2px 5px rgba(255, 255, 255, 0.2),
        inset 0 0 10px rgba(0, 0, 0, 0.2);
      }
      
      .wheel-label {
        position: absolute;
        color: #999;
        font-size: 16px; 
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
      }
      .lbl-menu:hover, .lbl-prev:hover, .lbl-next:hover, .lbl-play:hover {
        color: var(--container-prim);
        
      }
      .lbl-menu { top: 20px; left: 50%; transform: translateX(-50%); }
      .lbl-prev { left: 20px; top: 50%; transform: translateY(-50%); }
      .lbl-next { right: 20px; top: 50%; transform: translateY(-50%); }
      .lbl-play { bottom: 20px; left: 50%; transform: translateX(-50%); }

      /* List and Player Styles (Common) */
      .screen-header {
  background: #c0c0c0;

  padding: 3px 6px;

}
      
      
      .battery-status-container {
  display: flex;
  align-items: center;
  gap: 2px;
}
      
      .rotated-battery {
  font-size: 11px;
  line-height: 1;
  transform: rotate(90deg);

  display: inline-block;

}

.battery-text {

  font-size: 11px;

}

      .player-view {

        justify-content: center;
        height: 100%;

        background: #fff;

      /* Hide previous/next buttons in player view */
#btn-prev-track,
#btn-next-track {

}
      
      .now-playing-title {

      }

        position: relative;

      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: var(--container-prim);

        transition: width 0.2s;
      }

      
      /* --- STATUS MESSAGES --- */
      .status-msg {
        position: absolute;
        font-size: 12px;
        color: #888;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
        background: rgba(255,255,255,0.9);
        padding: 4px 8px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      /* Different Message Positions */
      .msg-loading {
        top: 50%;
        left: 50%;
        transform: translateX(-50%);
      }

      .msg-player {
        top: 53.5%;
        right: 25px;
        left: auto;
        transform: translateY(-50%);
      }

      .msg-skip {
        top: 20%;

        transform: translateY(-50%);
        font-weight: bold;
        color: var(--container-prim);
      }

      .msg-volume {
        top: 15%;

        font-weight: bold;
        color: var(--container-prim);
      }

      .msg-repeat {
        top: 30%;

        left: auto;
        transform: translateY(-50%);
        color: var(--container-prim);
        font-weight: bold;
      }

      .msg-shuffle {
        top: 30%;
        right: 20px;
        left: auto;
        transform: translateY(-50%);
        color: var(--container-prim);
        font-weight: bold;
      }

      .msg-speed {
        top: 60%;
        left: 50%;
        transform: translateX(-50%);
        font-weight: bold;
        color: var(--container-prim);
      }

      .msg-info {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        
      }
      
      [data-theme="dark"] .status-msg {
        color: #ccc;
        background: rgba(30,30,30,0.9);
        border: 1px solid #555;
      }
      
      /* --- SETTINGS BUTTONS --- */
      .settings-btn {
        background: #dd8399;

      [data-theme="dark"] .settings-btn {

}

<div class="ipod-container">

<!-- Hidden Audio Element -->

<script>
    // --- Variables ---
    let surahs = [];
    let currentIndex = 0;
    let isPlaying = false;
    const audio = document.getElementById('audio-player');
    const listEl = document.getElementById('surah-list');
    const playerView = document.getElementById('player-view');
    const settingsView = document.getElementById('settings-view');
    const npTitle = document.getElementById('np-title');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const centerBtn = document.getElementById('center-btn');
    const wheel = document.getElementById('wheel');
    
    // Theme buttons
        const btnTheme = document.getElementById('btn-theme');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    
    // New features
    const btnPrevTrack = document.getElementById('btn-prev-track');
    const btnNextTrack = document.getElementById('btn-next-track');
    const btnRepeat = document.getElementById('btn-repeat');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnSpeedDown = document.getElementById('btn-speed-down');
    const btnSpeedUp = document.getElementById('btn-speed-up');
    const speedDisplay = document.getElementById('speed-display');
    
    // Repeat and shuffle modes
    let repeatMode = false;
    let shuffleMode = false;
    let shuffledIndices = [];
    let currentShuffleIndex = 0;
    
    // Playback speed
    let playbackSpeed = 1.0;
    const speedLevels = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
    
    // Volume level control
    let targetVolume = 1.0;
    let volumeInterval = null;

    // --- Show Message Function ---
    function showMessage(msgId, text, timeout = 1000) {
        // Hide all messages
        document.querySelectorAll('.status-msg').forEach(el => el.style.opacity = '0');
        
        // Select desired message
        const msgEl = document.getElementById(msgId);
        if (msgEl) {
            msgEl.textContent = text;
            msgEl.style.opacity = '1';
            
            if (timeout > 0) {
                setTimeout(() => {
                    msgEl.style.opacity = '0';
                }, timeout);
            }
        }
    }

    // --- 1. Data Fetching (Al Quran Cloud API) ---
    async function fetchSurahs() {
        try {
            const response = await fetch('https://api.alquran.cloud/v1/edition?format=audio&language=ar');
            const data = await response.json();
            
            const metaResponse = await fetch('https://api.alquran.cloud/v1/surah');
            const metaData = await metaResponse.json();
            surahs = metaData.data;

            renderList();
        } catch (error) {
            listEl.innerHTML = '<li style="padding:10px;">An error occurred.</li>';
            console.error(error);
        }
    }

    // --- 2. Display List on Screen ---
    function renderList() {
        listEl.innerHTML = '';
        
        surahs.forEach((surah, index) => {
            const li = document.createElement('li');
            li.className = `surah-item ${index === currentIndex ? 'active' : ''}`;
            li.textContent = `${surah.number}. ${surah.name}`;
            
            // If shuffle mode is active, use encrypted index instead of real index
            if (shuffleMode) {
                li.addEventListener('click', () => selectSurahByShuffle(index));
            } else {
                li.addEventListener('click', () => selectSurah(index));
            }
            
            listEl.appendChild(li);
        });
        
        // Center active item
        const activeItem = listEl.children[currentIndex];
        if (activeItem) {
            activeItem.scrollIntoView({ block: 'center' });
        }
    }

    // --- 3. Surah Selection and Playback ---
    function selectSurah(index) {
        currentIndex = index;
        renderList(); 
        
        const surah = surahs[currentIndex];
        
        showMessage('msg-loading', "Loading...", 0);
        
        const directUrl = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${surah.number}.mp3`;
        
        loadAndPlay(directUrl, surah.name);
    }

    // Surah selection in shuffle mode
    function selectSurahByShuffle(shuffledIndex) {
        if (!shuffledMode || !shuffledIndices.length) return;
        
        currentIndex = shuffledIndices[shuffledIndex];
        currentShuffleIndex = shuffledIndex;
        renderList();
        
        const surah = surahs[currentIndex];
        showMessage('msg-loading', "Loading...", 0);
        
        const directUrl = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${surah.number}.mp3`;
        
        loadAndPlay(directUrl, surah.name);
    }

    function loadAndPlay(url, name) {
        audio.src = url;
        audio.playbackRate = playbackSpeed;
        audio.loop = repeatMode;
        
        audio.play().then(() => {
            isPlaying = true;
            showPlayerView(name);
            showMessage('msg-player', "Playing");
        }).catch(e => {
            console.log("Playback error", e);
            showMessage('msg-loading', "Could not play", 2000);
        });
    }

    function showPlayerView(name) {
        listEl.style.display = 'none';
        settingsView.style.display = 'none';
        playerView.style.display = 'flex';
        npTitle.textContent = name;
    }

    function showListView() {
        playerView.style.display = 'none';
        settingsView.style.display = 'none';
        listEl.style.display = 'block';
        audio.pause();
        isPlaying = false;
        showMessage('msg-player', '', 0);
    }

    // --- 4. Click Wheel Logic (Touch/Mouse) ---
    let startX, startY;
    let isDragging = false;
    let lastAngle = 0;
    let lastSkipTime = 0;
    const SKIP_SECONDS = 5;

    wheel.addEventListener('mousedown', startDrag);
    wheel.addEventListener('touchstart', startDrag, {passive: false});

    window.addEventListener('mousemove', onDrag);
    window.addEventListener('touchmove', onDrag, {passive: false});

    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    // Mouse movement for volume control (long press on left/right edges)
    let wheelLongPressTimer = null;

    function startDrag(e) {
        if(e.target === centerBtn) return;
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const rect = wheel.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        lastAngle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
        
        // Long press detection
        wheelLongPressTimer = setTimeout(() => {
            // Wheel long press switches to volume control
            if (playerView.style.display === 'flex') {
                toggleVolumeControl();
            }
        }, 800);
    }

    function onDrag(e) {
    if (!isDragging) return;
    e.preventDefault();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = wheel.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    const currentAngle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
    let delta = currentAngle - lastAngle;

    if (delta < -180) delta += 360;
    if (delta > 180) delta -= 360;

    if (Math.abs(delta) > 15) {
        clearTimeout(wheelLongPressTimer);
        
        // IF PLAYER IS OPEN - SONG SEEKING
        if (playerView.style.display === 'flex') {
            if (Date.now() - lastSkipTime < 300) return;
            
            if (delta > 0) {
                audio.currentTime = Math.min(audio.duration, audio.currentTime + SKIP_SECONDS);
                showMessage('msg-skip', "+" + SKIP_SECONDS + "s");
            } else {
                audio.currentTime = Math.max(0, audio.currentTime - SKIP_SECONDS);
                showMessage('msg-skip', "-" + SKIP_SECONDS + "s");
            }
            lastSkipTime = Date.now();
        } 
        // IF SETTINGS ARE OPEN - SCROLLING
        else if (settingsView.style.display !== 'none') {
            const scrollAmount = delta > 0 ? 40 : -40; 
            settingsView.scrollTop += scrollAmount;
            // Show scrolling message
            showMessage('msg-player', '', 0);
        }
        // IF LIST IS OPEN - NAVIGATION
        else {
            changeSelection(delta > 0 ? 1 : -1);
        }
        
        lastAngle = currentAngle;
    }
}

    function endDrag() {
        isDragging = false;
        clearTimeout(wheelLongPressTimer);
    }

    function changeSelection(direction) {
        if (playerView.style.display === 'flex') return;
        
        let newIndex;
        if (shuffleMode && shuffledIndices.length) {
            // In shuffle mode, go to next random item
            currentShuffleIndex = (currentShuffleIndex + direction + shuffledIndices.length) % shuffledIndices.length;
            newIndex = shuffledIndices[currentShuffleIndex];
        } else {
            newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = surahs.length - 1;
            if (newIndex >= surahs.length) newIndex = 0;
        }
        
        currentIndex = newIndex;
        renderList();
    }

    // --- 5. Center Button (Select) - Double Click for Repeat ---
    let lastClickTime = 0;

    centerBtn.addEventListener('click', () => {
        const now = Date.now();
        
        if (playerView.style.display === 'flex') {
            // If player is open: Pause/Play
            if (now - lastClickTime < 300) {
                // Double click: Toggle loop mode
                toggleRepeatMode();
            } else {
                // Single click: Normal play/pause
                if (audio.paused) {
                    audio.play();
                    isPlaying = true;
                    showMessage('msg-player', "Playing");
                } else {
                    audio.pause();
                    isPlaying = false;
                    showMessage('msg-player', "Paused");
                }
            }
        } else {
            // If list or settings are open: Select and Play
            if (settingsView.style.display !== 'none') {
                // If we're in settings view, return to list
                showListView();
            } else {
                selectSurah(currentIndex);
            }
        }
        
        lastClickTime = now;
    });

    // --- 6. Side Buttons (Back/Forward/Play) ---
    document.querySelector('.lbl-menu').addEventListener('click', () => {
        if (playerView.style.display === 'flex') {
            showListView();
            return;
        }

        if (listEl.style.display !== 'none') {
            listEl.style.display = 'none';
            settingsView.style.display = 'flex';
            showMessage('msg-player', 'Settings', 0);
        } else if (settingsView.style.display !== 'none') {
            settingsView.style.display = 'none';
            listEl.style.display = 'block';
            showMessage('msg-player', '', 0);
        }
    });

    // Update existing lbl-prev event listener:
document.querySelector('.lbl-prev').addEventListener('click', () => {
    if (playerView.style.display === 'flex') {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
        showMessage('msg-skip', "-10s");
    } else if (settingsView.style.display !== 'none') {
        
        settingsView.scrollTop = Math.max(0, settingsView.scrollTop - 50);
    } else if (listEl.style.display === 'none') {
        
        changeSelection(-1);
    } else {
        changeSelection(-1);
    }
});


document.querySelector('.lbl-next').addEventListener('click', () => {
    if (playerView.style.display === 'flex') {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        showMessage('msg-skip', "+10s");
    } else if (settingsView.style.display !== 'none') {
        
        const maxScroll = settingsView.scrollHeight - settingsView.clientHeight;
        settingsView.scrollTop = Math.min(maxScroll, settingsView.scrollTop + 50);
    } else {
        changeSelection(1);
    }
});

    // Play/Pause button - Long press for volume control
    const playPauseBtn = document.querySelector('.lbl-play');
    let longPressTimer;

    playPauseBtn.addEventListener('mousedown', startButtonLongPress);
    playPauseBtn.addEventListener('touchstart', startButtonLongPress);

    function startButtonLongPress(e) {
        e.preventDefault();
        longPressTimer = setTimeout(() => {
            toggleVolumeControl();
        }, 800);
        
        // Short press action
        if (playerView.style.display === 'flex') {
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                showMessage('msg-player', "Playing");
            } else {
                audio.pause();
                isPlaying = false;
                showMessage('msg-player', "Paused");
            }
        } else if (listEl.style.display !== 'none') {
            selectSurah(currentIndex);
        }
    }

    playPauseBtn.addEventListener('mouseup', () => clearTimeout(longPressTimer));
    playPauseBtn.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
    playPauseBtn.addEventListener('touchend', () => clearTimeout(longPressTimer));

    // --- 7. Controls Inside Player ---
    btnPrevTrack.addEventListener('click', () => {
        if (currentIndex > 0) {
            selectSurah(currentIndex - 1);
        } else {
            selectSurah(surahs.length - 1);
        }
    });

    btnNextTrack.addEventListener('click', () => {
        if (currentIndex < surahs.length - 1) {
            selectSurah(currentIndex + 1);
        } else {
            selectSurah(0);
        }
    });

    // Progress Bar Clickability
    progressContainer.addEventListener('click', function(e) {
        if (!audio.duration) return;
        
        const rect = this.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const percent = clickX / width;
        audio.currentTime = percent * audio.duration;
        showMessage('msg-skip', formatTime(audio.currentTime));
    });

        // --- 8. Theme Change ---
    
    
    function updateThemeButton() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            themeIcon.className = 'fas fa-sun';
            themeText.textContent = 'Light Mode';
        } else {
            themeIcon.className = 'fas fa-moon';
            themeText.textContent = 'Dark Mode';
        }
    }

    
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        showMessage('msg-player', theme === 'light' ? "Light Mode" : "Dark Mode");
    }

    
    btnTheme.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
        updateThemeButton();
    });

    
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        setTheme(savedTheme);
    }
    updateThemeButton(); 

    

        // --- 9. Repeat Mode ---
    function toggleRepeatMode() {
        repeatMode = !repeatMode;
        audio.loop = repeatMode;
        
        if (repeatMode) {
            showMessage('msg-repeat', "Repeat Mode On", 2000);
            btnRepeat.style.background = '#2E7D32';
            btnRepeat.style.color = '#fff';
        } else {
            showMessage('msg-repeat', "Repeat Mode Off", 2000);
            btnRepeat.style.background = ''; 
            btnRepeat.style.color = '';
        }
    }
    btnRepeat.addEventListener('click', () => toggleRepeatMode());

        // --- 10. Shuffle Mode ---
    function toggleShuffleMode() {
        shuffleMode = !shuffleMode;
        
        if (shuffleMode) {
            shuffledIndices = [...Array(surahs.length).keys()];
            shuffleArray(shuffledIndices);
            currentShuffleIndex = 0;
            showMessage('msg-shuffle', "Shuffle Mode On", 2000);
            btnShuffle.style.background = '#EF6C00';
            btnShuffle.style.color = '#fff';
        } else {
            shuffledIndices = [];
            currentShuffleIndex = 0;
            showMessage('msg-shuffle', "Shuffle Mode Off", 2000);
            btnShuffle.style.background = ''; 
            btnShuffle.style.color = '';
        }
        
        renderList();
    }
    btnShuffle.addEventListener('click', () => toggleShuffleMode());

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // --- 11. Volume Control ---
    function toggleVolumeControl() {
        if (volumeInterval) {
            clearInterval(volumeInterval);
            volumeInterval = null;
            showMessage('msg-volume', '');
            return;
        }
        
        // Volume increase/decrease loop
        let direction = audio.volume < 0.5 ? 1 : -1;
        
        volumeInterval = setInterval(() => {
            targetVolume = Math.max(0, Math.min(1, audio.volume + (direction * 0.1)));
            audio.volume = targetVolume;
            showMessage('msg-volume', 'Volume: ' + Math.round(targetVolume * 100) + '%', 0);
            
            if ((direction === 1 && targetVolume >= 1) || (direction === -1 && targetVolume <= 0)) {
                clearInterval(volumeInterval);
                volumeInterval = null;
            }
        }, 200);
    }

    // --- 12. Speed Control ---
    function changePlaybackSpeed(direction) {
        let index = speedLevels.indexOf(playbackSpeed);
        index += direction;
        
        if (index < 0) index = speedLevels.length - 1;
        if (index >= speedLevels.length) index = 0;
        
        playbackSpeed = speedLevels[index];
        audio.playbackRate = playbackSpeed;
        speedDisplay.textContent = playbackSpeed + 'x';
        showMessage('msg-speed', playbackSpeed + 'x Speed');
    }

    btnSpeedDown.addEventListener('click', () => changePlaybackSpeed(-1));
    btnSpeedUp.addEventListener('click', () => changePlaybackSpeed(1));

    // Mouse wheel on wheel for speed change
    wheel.addEventListener('wheel', (e) => {
        if (settingsView.style.display !== 'none') {
            e.preventDefault();
            const direction = e.deltaY > 0 ? -1 : 1;
            changePlaybackSpeed(direction);
        }
    });

    // --- 13. Audio Progress Bar Update ---
    audio.addEventListener('timeupdate', () => {
        if(audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            
            document.getElementById('curr-time').textContent = formatTime(audio.currentTime);
            document.getElementById('dur-time').textContent = formatTime(audio.duration);
        }
    });

    // Auto-advance to next surah when finished
    audio.addEventListener('ended', () => {
        if (repeatMode) return; // In repeat mode, replay same surah
        
        if (shuffleMode && shuffledIndices.length) {
            // In shuffle mode, go to next random song
            currentShuffleIndex = (currentShuffleIndex + 1) % shuffledIndices.length;
            currentIndex = shuffledIndices[currentShuffleIndex];
        } else {
            // In normal mode, go to next surah
            let next = currentIndex + 1;
            if(next >= surahs.length) {
                if (repeatMode) {
                    next = 0;
                } else {
                    showMessage('msg-player', "Playlist Complete", 2000);
                    return;
                }
            }
            currentIndex = next;
        }
        
        selectSurah(currentIndex);
    });

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    
    fetchSurahs();

</script>
