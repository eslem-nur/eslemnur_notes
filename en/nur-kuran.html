        /* --- GENERAL SETTINGS --- */
* { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

body {

.logo {

.logo span {

    .nav-links a:hover {

    }

    /* CONTENT SETTINGS */
    h1 {
        font-size: 1.5rem !important;
        margin: 20px 0 15px 0 !important;
        text-align: center;
    }

    .header-sub {
        font-size: 0.95rem;

}

    <div class="container">
        <h1>🌸 Nur Al-Quran Al-Kareem 🌸</h1>
        <p class="header-sub">رَبِّ زِدْنَا عِلْمًا | Oh Allah, increase us in knowledge.</p>

        <div class="controls">
            <select id="translationSelect">
                <option value="en.sahih">Sahih International</option>
                <option value="en.yusufali">Yusuf Ali</option>
                <option value="en.pickthall">Pickthall</option>
                <option value="en.shakir">Shakir</option>
                <option value="en.maududi">Abul Ala Maududi</option>
                <option value="en.hilali">Hilali & Khan</option>
                <option value="en.arberry">A.J. Arberry</option>
            </select>
            <select id="surahSelect">
                <option value="" disabled selected>Select a Surah...</option>
            </select>
            <button onclick="displaySurah()">Read</button>
        </div>

        <div id="content" class="quran-display">
            <p class="loading">Please select a translation and surah to begin...</p>
        </div>
        
        
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }

        const menuLinks = document.querySelectorAll('.nav-links a');
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                const navLinks = document.querySelector('.nav-links');
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                }
            });
        });

        
        // ENGLISH SURAH NAMES MAPPING TABLE
        const enSurahNames = {
            1: "Al-Fatihah", 2: "Al-Baqarah", 3: "Ali 'Imran", 4: "An-Nisa", 5: "Al-Ma'idah", 6: "Al-An'am", 7: "Al-A'raf", 8: "Al-Anfal", 9: "At-Tawbah", 10: "Yunus",
            11: "Hud", 12: "Yusuf", 13: "Ar-Rad", 14: "Ibrahim", 15: "Al-Hijr", 16: "An-Nahl", 17: "Al-Isra", 18: "Al-Kahf", 19: "Maryam", 20: "Taha",
            21: "Al-Anbiya", 22: "Al-Hajj", 23: "Al-Mu'minun", 24: "An-Nur", 25: "Al-Furqan", 26: "Ash-Shu'ara", 27: "An-Naml", 28: "Al-Qasas", 29: "Al-'Ankabut", 30: "Ar-Rum",
            31: "Luqman", 32: "As-Sajdah", 33: "Al-Ahzab", 34: "Saba", 35: "Fatir", 36: "Ya-Sin", 37: "As-Saffat", 38: "Sad", 39: "Az-Zumar", 40: "Ghafir",
            41: "Fussilat", 42: "Ash-Shuraa", 43: "Az-Zukhruf", 44: "Ad-Dukhan", 45: "Al-Jathiyah", 46: "Al-Ahqaf", 47: "Muhammad", 48: "Al-Fath", 49: "Al-Hujurat", 50: "Qaf",
            51: "Adh-Dhariyat", 52: "At-Tur", 53: "An-Najm", 54: "Al-Qamar", 55: "Ar-Rahman", 56: "Al-Waqi'ah", 57: "Al-Hadid", 58: "Al-Mujadila", 59: "Al-Hashr", 60: "Al-Mumtahanah",
            61: "As-Saff", 62: "Al-Jumu'ah", 63: "Al-Munafiqun", 64: "At-Taghabun", 65: "At-Talaq", 66: "At-Tahrim", 67: "Al-Mulk", 68: "Al-Qalam", 69: "Al-Haqqah", 70: "Al-Ma'arij",
            71: "Nuh", 72: "Al-Jinn", 73: "Al-Muzzammil", 74: "Al-Muddaththir", 75: "Al-Qiyamah", 76: "Al-Insan", 77: "Al-Mursalat", 78: "An-Naba", 79: "An-Nazi'at", 80: "'Abasa",
            81: "At-Takwir", 82: "Al-Infitar", 83: "Al-Mutaffifin", 84: "Al-Inshiqaq", 85: "Al-Buruj", 86: "At-Tariq", 87: "Al-A'la", 88: "Al-Ghashiyah", 89: "Al-Fajr", 90: "Al-Balad",
            91: "Ash-Shams", 92: "Al-Layl", 93: "Ad-Duha", 94: "Ash-Sharh", 95: "At-Tin", 96: "Al-Alaq", 97: "Al-Qadr", 98: "Al-Bayyinah", 99: "Az-Zalzalah", 100: "Al-'Adiyat",
            101: "Al-Qari'ah", 102: "At-Takathur", 103: "Al-Asr", 104: "Al-Humazah", 105: "Al-Fil", 106: "Quraysh", 107: "Al-Ma'un", 108: "Al-Kawthar", 109: "Al-Kafirun", 110: "An-Nasr",
            111: "Al-Masad", 112: "Al-Ikhlas", 113: "Al-Falaq", 114: "An-Nas"
        };

        // Translation names for display
        const translationNames = {
            'en.sahih': 'Sahih International (2013)',
            'en.yusufali': 'Abdullah Yusuf Ali (1934)',
            'en.pickthall': 'Mohammed Marmaduke Pickthall (1930)',
            'en.shakir': 'M. H. Shakir (1983)',
            'en.maududi': 'Abul Ala Maududi (1972)',
            'en.hilali': 'Muhammad Taqi-ud-Din al-Hilali (1996)',
            'en.arberry': 'Arthur John Arberry (1955)'
        };

        const translationSelect = document.getElementById('translationSelect');
        const surahSelect = document.getElementById('surahSelect');
        const contentDiv = document.getElementById('content');
        let surahData = [];

        // Fetch Surah List
        async function loadSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahData = data.data;
                
                surahSelect.innerHTML = '<option value="" disabled selected>Select a Surah...</option>';
                
                surahData.forEach(surah => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    const enName = enSurahNames[surah.number] || surah.name;
                    option.text = `${surah.number}. ${enName}`;
                    surahSelect.appendChild(option);
                });
            } catch (error) {
                contentDiv.innerHTML = "<p>Error loading surah list. Please refresh the page.</p>";
                console.error('Failed to load surah list:', error);
            }
        }

        // Get and display Surah with selected translation
        async function displaySurah() {
            const surahNumber = surahSelect.value;
            const translationId = translationSelect.value;
            
            if(!surahNumber) {
                contentDiv.innerHTML = "<p>Please select a surah.</p>";
                return;
            }

            if(!translationId) {
                contentDiv.innerHTML = "<p>Please select a translation.</p>";
                return;
            }

            contentDiv.innerHTML = '<p class="loading">Loading...</p>';

            try {
                // Fetch Arabic text
                const resAr = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.alafasy`);
                // Fetch selected translation
                const resTrans = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${translationId}`);
                
                const dataAr = await resAr.json();
                const dataTrans = await resTrans.json();

                const ayahsAr = dataAr.data.ayahs;
                const ayahsTrans = dataTrans.data.ayahs;
                
                const name = enSurahNames[surahNumber] || dataAr.data.name;

                let html = `<h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color);">${name}</h2>`;
                html += `<p class="translation-info">${translationNames[translationId]}</p>`;
                
                // Basmala (Except Fatiha and Tawbah)
                if(surahNumber != 1 && surahNumber != 9) {
                    html += `<span class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>`;
                }

                ayahsAr.forEach((ayah, index) => {
                    const textAr = ayah.text.replace(/[\u0660-\u0669]/g, ''); 
                    const textTrans = ayahsTrans[index].text;
                    
                    html += `
                        <div class="arabic">${textAr} <span style="color:var(--primary-color); font-size:1.2rem; font-family:'Lato'">(${index + 1})</span></div>
                        <div class="translation">${textTrans}</div>
                        <hr style="border:0; border-top:1px dashed var(--border-color); margin: 25px 0;">
                    `;
                });

                contentDiv.innerHTML = html;

            } catch (error) {
                contentDiv.innerHTML = "<p>An error occurred while fetching data. Please try again.</p>";
                console.error('Failed to load surah:', error);
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme(); // Initialize theme
            loadSurahList(); // Fetch surah list
        });
    </script>
</body>
</html>
