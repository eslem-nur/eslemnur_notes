    <div class="container">
        <h1>🌸 Nur Al-Quran Al-Kareem 🌸</h1>
        <p class="header-sub">رَبِّ زِدْنَا عِلْمًا | Mon Seigneur, accrois mon savoir.</p>

        <div class="controls">
            <select id="translationSelect">
                <option value="fr.hamidullah">Muhammad Hamidullah</option>
                <option value="fr.kasimirski">Alfred de Casimirski</option>
                <option value="fr.montada">Montada Islamic Foundation</option>
            </select>
            <select id="surahSelect">
                <option value="" disabled selected>Sélectionnez une Sourate...</option>
            </select>
            <button onclick="displaySurah()">Lire</button>
        </div>

        <div id="content" class="quran-display">
            <p class="loading">Veuillez sélectionner une traduction et une sourate pour commencer...</p>
        </div>
        
        
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }

        const menuLinks = document.querySelectorAll('.nav-links a');
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                const navLinks = document.querySelector('.nav-links');
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                }
            });
        });

        
        // TABLEAU DE CARTOGRAPHIE DES NOMS DE SOURATES FRANCAIS
        const frSurahNames = {
            1: "Al-Fatiha", 2: "Al-Baqara", 3: "Ali 'Imran", 4: "An-Nisa", 5: "Al-Ma'idah", 6: "Al-An'am", 7: "Al-A'raf", 8: "Al-Anfal", 9: "At-Tawbah", 10: "Yunus",
            11: "Hud", 12: "Yusuf", 13: "Ar-Rad", 14: "Ibrahim", 15: "Al-Hijr", 16: "An-Nahl", 17: "Al-Isra", 18: "Al-Kahf", 19: "Maryam", 20: "Taha",
            21: "Al-Anbiya", 22: "Al-Hajj", 23: "Al-Mu'minun", 24: "An-Nur", 25: "Al-Furqan", 26: "Ash-Shu'ara", 27: "An-Naml", 28: "Al-Qasas", 29: "Al-Ankabut", 30: "Ar-Rum",
            31: "Luqman", 32: "As-Sajda", 33: "Al-Ahzab", 34: "Saba", 35: "Fatir", 36: "Ya Sin", 37: "As-Saffat", 38: "Sad", 39: "Az-Zumar", 40: "Ghafir",
            41: "Fussilat", 42: "Ash-Shura", 43: "Az-Zukhruf", 44: "Ad-Dukhan", 45: "Al-Jathiyah", 46: "Al-Ahqaf", 47: "Muhammad", 48: "Al-Fath", 49: "Al-Hujurat", 50: "Qaf",
            51: "Adh-Dhariyat", 52: "At-Tur", 53: "An-Najm", 54: "Al-Qamar", 55: "Ar-Rahman", 56: "Al-Waqi'a", 57: "Al-Hadid", 58: "Al-Mujadila", 59: "Al-Hashr", 60: "Al-Mumtahanah",
            61: "As-Saff", 62: "Al-Jumu'a", 63: "Al-Munafiqun", 64: "At-Taghabun", 65: "At-Talaq", 66: "At-Tahrim", 67: "Al-Mulk", 68: "Al-Qalam", 69: "Al-Haqqah", 70: "Al-Ma'arij",
            71: "Nuh", 72: "Al-Jinn", 73: "Al-Muzzammil", 74: "Al-Muddaththir", 75: "Al-Qiyama", 76: "Al-Insan", 77: "Al-Mursalat", 78: "An-Naba", 79: "An-Nazi'at", 80: "'Abasa",
            81: "At-Takwir", 82: "Al-Infitar", 83: "Al-Mutaffifin", 84: "Al-Inshiqaq", 85: "Al-Buruj", 86: "At-Tariq", 87: "Al-A'la", 88: "Al-Ghashiya", 89: "Al-Fajr", 90: "Al-Balad",
            91: "Ash-Shams", 92: "Al-Layl", 93: "Ad-Duha", 94: "Ash-Sharh", 95: "At-Tin", 96: "Al-Alaq", 97: "Al-Qadr", 98: "Al-Bayyinah", 99: "Az-Zalzalah", 100: "Al-Adiyat",
            101: "Al-Qari'a", 102: "At-Takathur", 103: "Al-Asr", 104: "Al-Humaza", 105: "Al-Fil", 106: "Quraysh", 107: "Al-Ma'un", 108: "Al-Kawthar", 109: "Al-Kafirun", 110: "An-Nasr",
            111: "Al-Masad", 112: "Al-Ikhlas", 113: "Al-Falaq", 114: "An-Nas"
        };

        // Noms de traduction pour affichage
        const translationNames = {
            'fr.hamidullah': 'Muhammad Hamidullah (1987)',
            'fr.kasimirski': 'Alfred de Casimirski (1840)',
            'fr.montada': 'Montada Islamic Foundation (2004)'
        };

        const translationSelect = document.getElementById('translationSelect');
        const surahSelect = document.getElementById('surahSelect');
        const contentDiv = document.getElementById('content');
        let surahData = [];

        // Charger la liste des sourates
        async function loadSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahData = data.data;
                
                surahSelect.innerHTML = '<option value="" disabled selected>Sélectionnez une sourate...</option>';
                
                surahData.forEach(surah => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    const frName = frSurahNames[surah.number] || surah.name;
                    option.text = `${surah.number}. ${frName}`;
                    surahSelect.appendChild(option);
                });
            } catch (error) {
                contentDiv.innerHTML = "<p>Erreur lors du chargement de la liste des sourates. Veuillez rafraîchir la page.</p>";
                console.error('Erreur lors du chargement de la liste des sourates:', error);
            }
        }

        // Récupérer et afficher la sourate
        async function displaySurah() {
            const surahNumber = surahSelect.value;
            const translationId = translationSelect.value;
            
            if(!surahNumber) {
                contentDiv.innerHTML = "<p>Veuillez sélectionner une sourate.</p>";
                return;
            }

            if(!translationId) {
                contentDiv.innerHTML = "<p>Veuillez sélectionner une traduction.</p>";
                return;
            }

            contentDiv.innerHTML = '<p class="loading">Chargement...</p>';

            try {
                // Récupérer le texte arabe
                const resAr = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.alafasy`);
                // Récupérer la traduction sélectionnée
                const resTrans = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${translationId}`);
                
                const dataAr = await resAr.json();
                const dataTrans = await resTrans.json();

                const ayahsAr = dataAr.data.ayahs;
                const ayahsTrans = dataTrans.data.ayahs;
                
                const name = frSurahNames[surahNumber] || dataAr.data.name;

                let html = `<h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color);">${name}</h2>`;
                html += `<p class="translation-info">${translationNames[translationId]}</p>`;
                
                // Basmala (Sauf Fatiha et Tawbah)
                if(surahNumber != 1 && surahNumber != 9) {
                    html += `<span class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>`;
                }

                ayahsAr.forEach((ayah, index) => {
                    const textAr = ayah.text.replace(/[\u0660-\u0669]/g, ''); 
                    const textTrans = ayahsTrans[index].text;
                    
                    html += `
                        <div class="arabic">${textAr} <span style="color:var(--primary-color); font-size:1.2rem; font-family:'Lato'">(${index + 1})</span></div>
                        <div class="translation">${textTrans}</div>
                        <hr style="border:0; border-top:1px dashed var(--border-color); margin: 25px 0;">
                    `;
                });

                contentDiv.innerHTML = html;

            } catch (error) {
                contentDiv.innerHTML = "<p>Une erreur est survenue. Veuillez réessayer.</p>";
                console.error('Erreur lors du chargement de la sourate:', error);
            }
        }

        // Initialiser au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            initTheme(); // Initialiser le thème
            loadSurahList(); // Récupérer la liste des sourates
        });
    </script>
