<!DOCTYPE html>
<html lang="tr" data-color="black" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKuran | Eslem Nur</title>
    <meta name="description" content="Eslem Nur Çetin - İlahiyat öğrencisi ve web geliştiricisinin iKuran uygulaması. Dijital iPod ile Kur'an dinle.">
    <meta name="keywords" content="İslami İlimler, Web Geliştirme, Tefsir, Arapça, Kuran, Proton, Eslem Nur Çetin, İmam Hatip, Dijital Notlar, iKuran, iPod, pink">
    <meta name="author" content="Eslem Nur Çetin">
    <meta name="robots" content="index, follow">

    
    <!-- Open Graph (Sosyal Medya Paylaşımı İçin) -->
    <meta property="og:title" content="Eslem Nur | iKuran Siyah>
    <meta property="og:description" content="İlim talebesi ve yazılımcı portfolyosu. Ücretsiz ilmi notlar ve dijital uygulamalar.">
    <meta property="og:image" content="https://i.pinimg.com/474x/0a/cd/85/0acd85ec00ccc7a50823aa2c8a4b18b6.jpg">
    <meta property="og:url" content="https://eslemnur.github.io/eslemnur_notes/tr/">
    <meta property="og:type" content="Web App">
    <meta property="og:locale" content="tr_TR">

    <!-- PWA Manifest  -->
    <link rel="apple-touch-icon" sizes="180x180" href="/eslemnur_notes/PWA/png/apple-touch-icon2.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/eslemnur_notes/PWA/png/favicon2-96x96.png" />
    <link rel="manifest" href="/eslemnur_notes/PWA/manifest/site2.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/eslemnur_notes/PWA/svg/favicon2.svg" />
    <link rel="shortcut icon" href="/eslemnur_notes/PWA/icon/favicon2.ico" />

    <!-- PWA Service Worker Kaydı -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          
          navigator.serviceWorker.register('/eslemnur_notes/PWA/js-files/sw2.js', { scope: '/eslemnur_notes/' })
            .then(reg => console.log('Service Worker başarıyla kaydedildi!', reg.scope))
            .catch(err => console.log('Service Worker kaydı başarısız:', err));
        });
      }
    </script>
    
  <!-- Fontlar & İkonlar -->
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- iKuran CSS -->
    <link rel="stylesheet" href="../ikuran-styles.css">

    
</head>
<body>

<div class="ipod-container">
    
    <!-- Ekran -->
    <div class="screen">
        <div class="screen-header">
          <div class="battery-status-container">
            <span class="rotated-battery">🔋</span>
            <span class="battery-text">100%</span>
        </div>
            <span>iKuran</span>
       </div>
        
        <!-- 1. Liste Görünümü -->
        <ul class="surah-list" id="surah-list">
            <li style="padding: 10px; text-align: center;">Yükleniyor...</li>
        </ul>

        <!-- 2. Çalar Görünümü -->
        <div class="player-view" id="player-view">
            <div class="now-playing-title" id="np-title">Sure Adı</div>
            <div class="now-playing-reciter">Mishary Alafasy</div>
            <div style="font-size: 40px; "><i class='fa-solid fa-music' style='color: #000'></i></div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div style="font-size:10px; color: #888;">
                <span id="curr-time">0:00</span> / <span id="dur-time">0:00</span>
            </div>
            
            <!-- Kontrol butonları player içinde  -->
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <button class="settings-btn" id="btn-prev-track"><i class='fa fa-fast-backward'></i> Önceki</button>
                <button class="settings-btn" id="btn-next-track">Sonraki <i class='fa fa-fast-forward'></i></button>
            </div>
        </div>

                <!-- 3. AYARLAR GÖRÜNÜMÜ -->
        <div class="player-view" id="settings-view" style="display: none;">
    <div class="now-playing-title">Ayarlar</div>
    
    <!-- İçerik kaydırılabilir -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; margin-bottom: 20px; width: 80%;">
        <!-- Butonlar -->
        <button id="btn-theme" class="settings-btn">
                    <i class='fas fa-moon' id="theme-icon"></i> 
                    <span id="theme-text">Koyu Mod</span>
                </button>
                
                <button id="btn-repeat" class="settings-btn" style="color: #FFF9F9;">
                    Tekrar Modu <i class='fas fa-sync-alt' style='color: white'></i>
                </button>
                <button id="btn-shuffle" class="settings-btn" style="color: #FFF9F9;">
                    Karıştır <i class='fas fa-random' style='color: white'></i>
                </button>
            </div>

    
    <!-- Hız kontrolü -->
    <div style="font-size: 12px; color: #888; margin-bottom: 6px;">Hız: <span id="speed-display">1.0x</span></div>
            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: center;">
                <button class="settings-btn" id="btn-speed-down" style="font-size: 10px; margin-bottom: 70px;"><i class='fas fa-minus'></i></button>
                <button class="settings-btn" id="btn-speed-up" style="font-size: 10px; margin-bottom: 70px; "><i class='fas fa-plus'></i></button>
            </div>
        </div>
        
        <!-- Durum Mesajları -->
        <div id="msg-loading" class="status-msg msg-loading">Yükleniyor...</div>
        <div id="msg-player" class="status-msg msg-player">Oynatılıyor</div>
        <div id="msg-skip" class="status-msg msg-skip">+5s</div>
        <div id="msg-volume" class="status-msg msg-volume">Ses</div>
        <div id="msg-repeat" class="status-msg msg-repeat">Tekrar</div>
        <div id="msg-shuffle" class="status-msg msg-shuffle">Karıştır</div>
        <div id="msg-speed" class="status-msg msg-speed">1.0x Hız</div>
    </div>
    <!-- Click Wheel -->
    <div class="click-wheel" id="wheel">
        <div class="wheel-label lbl-menu">Menu</div>
        <div class="wheel-label lbl-prev"><i class='fa fa-fast-backward'></i></div>
        <div class="wheel-label lbl-next"><i class='fa fa-fast-forward'></i></div>
        <div class="wheel-label lbl-play"><i class='fa fa-play'></i> <i class='fa fa-pause'></i></div>
        <div class="wheel-center" id="center-btn"></div>
    </div>
</div>

<!-- Gizli Audio Elementi -->
<audio id="audio-player"></audio>

    <!-- iKuran JavaScript -->
    <script src="../ikuran-scripts.js"></script>

</body>
</html>
